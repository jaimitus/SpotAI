[package]
name = "spotai"
version = "1.4.3"
description = "SpotAI - ultra-lightweight AI spotlight launcher"
authors = ["SpotAI Contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "spotai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
keyring = { version = "3", default-features = false, features = ["windows-native", "apple-native", "sync-secret-service"] }
arboard = "3"
bytes = "1"
parking_lot = "0.12"
xcap = "0.9"
image = "0.25"
base64 = "0.22"
cpal = "0.15"
hound = "3.5"
zip = { version = "2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
sqlite-vec = "0.1"
text-splitter = { version = "0.13", features = ["markdown"] }
chrono = "0.4"
pdf-extract = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Media_SpeechRecognition", "Foundation"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
