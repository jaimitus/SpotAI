name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: Build & publish release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + all tags: the changelog steps need to see every tag
          # to compute version ranges (a shallow clone only knows the current tag).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Auto-generate the release notes from conventional commits and expose
      # them as an output (tauri-action only accepts inline releaseBody).
      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          bash scripts/changelog.sh "${{ github.ref_name }}"
          {
            echo "body<<EOF"
            cat RELEASE_NOTES.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The private key for signing updater artifacts. Set it as a repo
          # secret (content of ~/.tauri/spotai.key) — never commit it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tagName: v__VERSION__
          releaseName: "SpotAI v__VERSION__"
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
      # Portable package: the standalone exe zipped for run-without-install
      # users. Attached to the release created by tauri-action above.
      - name: Create portable zip
        shell: powershell
        run: |
          Copy-Item src-tauri/target/release/spotai.exe SpotAI.exe
          Compress-Archive -Path SpotAI.exe -DestinationPath SpotAI-Portable.zip -Force
      - name: Upload portable zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" SpotAI-Portable.zip --repo jaimitus/SpotAI --clobber
      # Keep the versioned CHANGELOG.md in the repo in sync with this release.
      # Generates it from all git tags, commits as the bot and pushes to main.
      # Runs LAST so the release build always uses the exact tag checkout, and
      # the changelog push can never block publishing. (Pushes made with
      # GITHUB_TOKEN do not re-trigger other workflows, so no loop.)
      - name: Update CHANGELOG.md
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main origin/main
          bash scripts/changelog.sh --changelog
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md is already up to date - nothing to commit."
          else
            git add CHANGELOG.md
            git commit -m "docs: add CHANGELOG entry for ${{ github.ref_name }}"
            git push origin main
            echo "Pushed CHANGELOG.md update for ${{ github.ref_name }}."
          fi
