name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: Build & publish release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The private key for signing updater artifacts. Set it as a repo
          # secret (content of ~/.tauri/spotai.key) — never commit it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tagName: v__VERSION__
          releaseName: "SpotAI v__VERSION__"
          releaseBody: |
            See the assets below to download and install this version of SpotAI.
            Existing installs pick up the update automatically via the built-in updater.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
      # Portable package: the standalone exe zipped for run-without-install
      # users. Attached to the release created by tauri-action above.
      - name: Create portable zip
        shell: powershell
        run: |
          Copy-Item src-tauri/target/release/spotai.exe SpotAI.exe
          Compress-Archive -Path SpotAI.exe -DestinationPath SpotAI-Portable.zip -Force
      - name: Upload portable zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" SpotAI-Portable.zip --repo jaimitus/SpotAI --clobber
